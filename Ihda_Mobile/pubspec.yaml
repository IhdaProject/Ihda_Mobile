name: ihda_mobile
description: Ihda Mobile - prayer times, qibla direction and reminders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Networking (used once real backend is connected)
  dio: ^5.4.3+1

  # Local persistence
  shared_preferences: ^2.2.3

  # Opening external maps/links (Yo'nalish button, external resources)
  url_launcher: ^6.3.0

  # Notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

  # Maps
  yandex_mapkit_lite: ^2.0.2
  
  # Sensors and Location for Qibla
  flutter_compass: ^0.8.0
  geolocator: ^11.0.0
  permission_handler: ^11.3.1
  vibration: ^2.0.1

  # Date / Hijri formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

  # Uncomment and add real assets exported from Figma once available.
  # assets:
  #   - assets/images/
  #   - assets/icons/
